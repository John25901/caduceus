name: CGS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cgs-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CADUCEUS_HOME: /tmp/caduceus-ci
      CADUCEUS_ENABLE_SEMANTIC: "0"
      CADUCEUS_ENABLE_LLM_ARBITRATION: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall -q backend frontend scripts streamlit_app.py

      - name: Tests
        run: pytest -q

      - name: Référentiel douanier smoke test
        run: |
          python - <<'PY'
          from backend.app.customs.camcis_repository import CamcisRepository
          from backend.app.core.config import settings
          repo = CamcisRepository(settings.camcis_path)
          rows = repo.load()
          assert len(rows) > 6000, len(rows)
          print(f"CAMCIS OK: {len(rows)} positions")
          PY
